<section class="auth-page">
  <article class="auth-card">
    <p class="eyebrow">{{ 'auth.resetPasswordEyebrow' | translate }}</p>

    <h1>{{ 'auth.resetPasswordTitle' | translate }}</h1>

    <p class="subtitle">
      {{ 'auth.resetPasswordSubtitle' | translate }}
    </p>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <label>
        {{ 'auth.newPassword' | translate }}
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          required
          minlength="8"
        />
      </label>

      <label>
        {{ 'auth.confirmPassword' | translate }}
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          required
          minlength="8"
        />
      </label>

      <app-button
        type="submit"
        variant="create"
        [disabled]="iamFacade.loading() || !token"
        [block]="true"
      >
        @if (iamFacade.loading()) {
          {{ 'common.loading' | translate }}
        } @else {
          {{ 'auth.resetPasswordAction' | translate }}
        }
      </app-button>
    </form>

    <div class="links">
      <a routerLink="/iam/login">
        {{ 'auth.backToLogin' | translate }}
      </a>
    </div>
  </article>
</section>
